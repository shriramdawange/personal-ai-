name: AI Empire Engine CI

on:
  push:
    branches: [main, ai-empire-foundation, autonomous-ai-company]
    paths:
      - "ai-empire/engine/**"
      - ".github/workflows/ai-empire-engine.yml"
  pull_request:
    paths:
      - "ai-empire/engine/**"
      - ".github/workflows/ai-empire-engine.yml"

concurrency:
  group: ai-empire-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-empire/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q empire tests
      - name: Run database tests
        run: python -m unittest discover -s tests -v
